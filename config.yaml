data:
  minimum_lap_fraction: 0.9
  maximum_lap_fraction: 1.1

analysis:
  spatial_grid_m: 1.0
  micro_sector_m: 50.0
  max_boundary_speed_delta_mps: 2.0
  reference_lap_seconds: 144.640
  reference_lap_seconds_by_track:
    Sepang: 144.640

signal_filter:
  enabled: true
  rolling_median_window: 3
  order: 4
  cutoff_hz: 5.0

quarantine:
  max_speed_kmh: 350.0
  max_lateral_g: 3.5

tire_analysis:
  friction_circle_exponent: 1.5
  baseline_lap: null
  compare_lap: null
  degradation_minimum_laps: 15
  degradation_lap_time_drop_s: 0.5

vehicle:
  aero_downforce_mult: 0.85
  default_brake_bias: 58.5
  brake_active_threshold: 0.05
  minimum_cornering_lateral_g: 0.05
  minimum_slip_speed_kmh: 5.0
  high_speed_aero_threshold_kmh: 200.0
  brake_input_threshold_pct: 5.0

driver_inputs:
  active_profile: G7_PRO_CONTROLLER
  profiles:
    G7_PRO_CONTROLLER:
      brake_release_slope_pct_s: 600.0
      brake_release_min_speed_kmh: 60.0
      throttle_snap_slope_pct_s: 800.0
      loaded_steering_angle_deg: 20.0
      trail_brake_steering_angle_deg: 15.0
    LOAD_CELL_WHEEL:
      # Starting values only; calibrate these against the wheel and pedal setup.
      brake_release_slope_pct_s: 600.0
      brake_release_min_speed_kmh: 60.0
      throttle_snap_slope_pct_s: 800.0
      loaded_steering_angle_deg: 20.0
      trail_brake_steering_angle_deg: 15.0
